  - ["Research keeps consistent pseudonyms and the year. A court filing keeps the parties."]
  - ["A public release removes private individuals but keeps the physician acting officially."]

export:
  - ["Export burns the redaction into the pixels, so there is no hidden text layer,"]
  - ["and every decision goes into a hash-chained audit log."]

