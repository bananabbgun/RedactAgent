intro:   # slide 1 (cover)
  - ["This is RedactAgent: on-premises AI that finds and removes personal data from scanned documents.",
     "This is Redact Agent: on-premises A I that finds and removes personal data from scanned documents."]

problem:   # slide 2
  - ["We start with hospitals. Taiwan's hospitals discharge three point three million patients a year,"]
  - ["and every chart may later be requested: for research, for copies, for disputes and insurance claims."]
  - ["Each copy must be stripped of personal data first, and today that is done by hand."]
  - ["People miss identifiers: in a published study, a single reviewer found only eighty-one percent of them."]
  - ["Cloud AI is not an option for medical records, and the stakes are rising:",
     "Cloud A I is not an option for medical records, and the stakes are rising:"]
  - ["the amended data protection law brings breach notification and fines of up to fifteen million NT dollars."]

competition:   # slide 3
  - ["We checked the main de-identification products. None of them covers a Taiwanese hospital:"]
  - ["cloud only, no Traditional Chinese, or no scanned pages with seals and signatures,"]
  - ["and none attacks its own output to look for combinations that still identify someone."]

solution:   # slide 4
  - ["RedactAgent reads each page, detects personal data with rules, a local language model and a local vision model,",
     "Redact Agent reads each page, detects personal data with rules, a local language model and a local vision model,"]
  - ["and then does something new: a second model attacks the redacted page,"]
  - ["asking whether anyone could still be identified, before a person approves the release."]
  - ["Privacy fails on combinations, a job title plus an island, not only on ID numbers.",
     "Privacy fails on combinations, a job title plus an island, not only on I D numbers."]
  - ["That is why the last check is done by an agent that thinks like an attacker."]

