  - ["Card zero serves gpt-oss-20b with the native MXFP4 kernel;",
     "Card zero serves G P T O S S twenty B, with the native M X F P four kernel;"]
  - ["card one serves the Qwen 2.5 VL vision model. Both through vLLM, both resident all the time.",
