intro:   # slide 1 (cover)
  - ["This is RedactAgent: on-premises AI that finds and removes personal data from scanned documents.",
     "This is Redact Agent: on-premises A I that finds and removes personal data from scanned documents."]

problem:   # slide 2
  - ["Hospitals, law firms and government agencies share sensitive records every day,"]
  - ["for research, court cases, insurance claims and public-information requests."]
  - ["Every copy has to be de-identified first, and today that is mostly done by hand."]
  - ["Cloud AI is not an option: these documents are exactly the data that may not leave the building.",
     "Cloud A I is not an option: these documents are exactly the data that may not leave the building."]
  - ["And the stakes are rising: Taiwan's amended Personal Data Protection Act brings a dedicated regulator and higher fines.",
     "And the stakes are rising: Taiwan's amended Personal Data Protection Act brings a dedicated regulator, and higher fines."]

solution:   # slide 4
  - ["RedactAgent reads each page, detects personal data with rules, a local language model and a local vision model,",
     "Redact Agent reads each page, detects personal data with rules, a local language model and a local vision model,"]
  - ["and then does something new: a second model attacks the redacted page,"]
  - ["asking whether anyone could still be identified, before a person approves the release."]
  - ["Privacy fails on combinations, a job title plus an island, not only on ID numbers.",
     "Privacy fails on combinations, a job title plus an island, not only on I D numbers."]
  - ["That is why the last check is done by an agent that thinks like an attacker."]

env:   # terminal on the organiser's instance: hostname, xpu-smi, docker
  - ["Everything you see next runs on the Intel Cloud instance provided by the organisers."]
  - ["Two Intel Arc Pro B70 cards, 32 gigabytes each, and two Xeon 6 processors.",
