loops:   # slide on robustness (reasoning loops)
  - ["We also found a failure that only shows up at scale."]
  - ["The reasoning model sometimes repeats itself. Usually it recovers, sometimes it never stops."]
  - ["We measured it first: most loops end by themselves, a few never do."]
  - ["RedactAgent streams every answer, recognises a loop that will not end, cancels it and retries."]
  - ["For archives, sampling the same model removes loops entirely and is about forty percent faster."]

