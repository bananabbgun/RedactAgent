# Narration for the final video (story cut). One idea per screen; details live in the deck and the repository.
# Each segment: list of [caption, spoken] pairs (spoken may be omitted when identical).
# {placeholders} are filled from eval/results_b70/ by scripts/make_story_video.py.

cover:
  - ["RedactAgent removes personal data from scanned hospital records,",
     "Redact Agent removes personal data from scanned hospital records,"]
  - ["inside the hospital, on two Intel Arc Pro B70 cards.",
     "inside the hospital, on two Intel Arc Pro B seventy cards."]

volume:
  - ["Taiwan's hospitals discharge 3.35 million patients a year.",
     "Taiwan's hospitals discharge three point three five million patients a year."]
  - ["Any of those charts may be requested later: for research, as a copy, or in a dispute."]
  - ["Before it leaves, every name, ID number, signature and seal must be removed.",
     "Before it leaves, every name, I D number, signature and seal must be removed."]

humans:
  - ["Today that is done by hand, and people miss things."]
  - ["In a published study, one reviewer found only 81 percent of the identifiers.",
     "In a published study, one reviewer found only eighty-one percent of the identifiers."]
  - ["And a leak can now cost up to fifteen million NT dollars."]

notool:
  - ["No existing product fits: cloud services cannot take medical records,"]
  - ["and the ones we checked lack Traditional Chinese, or scanned seals and signatures."]

idea:
  - ["RedactAgent works in three steps."]
  - ["Detect: rules, a language model and a vision model find the personal data."]
  - ["Attack: an agent reads the redacted page like an attacker, looking for anything that still identifies someone."]
  - ["Decide: a person approves, and only then is the page released."]

combo:
  - ["Why attack? Because privacy fails on combinations."]
  - ["The name is gone, but 'the only ferry captain on Green Island' is still one person."]
  - ["Rules cannot see that. Our models can."]

env:   # terminal on the organiser's instance
  - ["This is the organisers' Intel Cloud instance with two Arc Pro B70 cards.",
     "This is the organisers' Intel Cloud instance, with two Arc Pro B seventy cards."]
  - ["Card zero runs the reasoning model, card one the vision model. Both stay loaded."]

review:
  - ["A scanned discharge summary. One click, and both cards work on it."]

review_found:
  - ["Ten seconds later: names, ID numbers, dates, the signature and the seal are found.",
     "Ten seconds later: names, I D numbers, dates, the signature and the seal are found."]

ferry:
  - ["And here is the combination clue: the ferry captain on Green Island."]

policies:
  - ["Each use gets its own policy. Research gets consistent pseudonyms,"]
  - ["a court filing keeps the parties, and a public release keeps only the doctor acting officially."]

export:
  - ["The agent attacked the redacted page: nothing identifying is left."]
  - ["A person approves. Export burns the redaction into the pixels and writes an audit log."]

chinese:
  - ["Traditional Chinese works the same way, with red seals and ROC dates.",
     "Traditional Chinese works the same way, with red seals and R O C dates."]

batch:
  - ["For a backlog, batch mode keeps both cards busy. This part is sped up."]

verify:   # terminal: live evaluation on v3
  - ["Is it accurate? We test on the same machine,"]
  - ["on documents made before any result was seen and never used for tuning."]

verify_result:
  - ["{live_recall} of all personal data found.",
     "{live_recall_spoken} of all personal data found."]

proof:
  - ["On the hospital documents in that test, RedactAgent removes {hosp_recall} before anyone reviews it.",
     "On the hospital documents in that test, Redact Agent removes {hosp_recall_spoken} before anyone reviews it."]
  - ["A single human reviewer finds 81 percent.",
     "A single human reviewer finds eighty-one percent."]
  - ["And it catches {qi_recall} of the combination clues, which rules miss completely.",
     "And it catches {qi_recall_spoken} of the combination clues, which rules miss completely."]

hardware:
  - ["This is the dual-card agent host the organisers proposed for the B70, built and measured.",
     "This is the dual-card agent host the organisers proposed for the B seventy, built and measured."]
  - ["A twenty-one billion parameter model fits on card zero with room for thirty-seven parallel requests."]
  - ["One host handles about {pages_hour} pages an hour: three million a year on a single shift.",
     "One host handles about {pages_hour_spoken} pages an hour: three million a year on a single shift."]

ready:
  - ["It is ready for a hospital: nothing leaves the building,"]
  - ["it plugs into hospital systems, and nothing is released without a person's approval."]
  - ["And ASUS already runs medical-record AI in Taiwanese hospitals.",
     "And Asus already runs medical-record A I in Taiwanese hospitals."]

next:
  - ["The three goals we set in Stage I are met on the B70.", "The three goals we set in Stage I are met on the B seventy."]
  - ["Next, we prove the rest: a study with reviewers, and a pilot with a hospital records office."]

outro:
  - ["RedactAgent. Share the document, not the person.", "Redact Agent. Share the document, not the person."]
