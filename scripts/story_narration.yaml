# Narration for the final video (story cut). One idea per screen; details live in the deck and the repository.
# Each segment: list of [caption, spoken] pairs (spoken may be omitted when identical).
# {placeholders} are filled from eval/results_b70/ by scripts/make_story_video.py.

cover:
  - ["RedactAgent removes personal data from scanned documents, without them leaving the building,",
     "Redact Agent removes personal data from scanned documents, without them leaving the building,"]
  - ["on two Intel Arc Pro B70 cards. Our first customers are hospitals.",
     "on two Intel Arc Pro B seventy cards. Our first customers are hospitals."]

everyone:
  - ["Every workplace hands out documents about people."]
  - ["Hospitals release charts, courts publish judgments, insurers pass on claims, and agencies answer information requests."]
  - ["Each copy must have its names, ID numbers, signatures and seals removed first, mostly by hand.",
     "Each copy must have its names, I D numbers, signatures and seals removed first, mostly by hand."]

whyhosp:
  - ["We start where the need is sharpest: hospitals."]
  - ["Medical records are the most protected data, and new laws raise the stakes."]
  - ["Taiwan's hospitals discharge 3.35 million patients a year, and any chart may be requested later.",
     "Taiwan's hospitals discharge three point three five million patients a year, and any chart may be requested later."]
  - ["And ASUS already sells medical-record AI to hospitals, so there is a way in.",
     "And Asus already sells medical-record A I to hospitals, so there is a way in."]

humans:
  - ["Doing it by hand is slow, and people miss things."]
  - ["In a published study, one reviewer found only 81 percent of the identifiers.",
     "In a published study, one reviewer found only eighty-one percent of the identifiers."]
  - ["And a leak can now cost up to fifteen million NT dollars."]

notool:
  - ["We checked the main de-identification products. None of them fits."]
  - ["The cloud services cannot run inside a hospital, and the health tools from Amazon and Microsoft have no Chinese."]
  - ["Private AI runs on premises, but its Traditional Chinese is still coming soon.",
     "Private A I runs on premises, but its Traditional Chinese is still coming soon."]
  - ["And none of them attacks its own output to check whether someone can still be identified."]

idea:
  - ["RedactAgent works in three steps."]
  - ["Detect: rules, a language model and a vision model find the personal data."]
  - ["Attack: an agent reads the redacted page like an attacker, looking for anything that still identifies someone."]
  - ["Decide: a person approves, and only then is the page released."]

combo:
  - ["Why attack? Because privacy fails on combinations."]
  - ["The name is gone, but 'the only ferry captain on Green Island' is still one person."]
  - ["Rules cannot see that. Our models can."]

env:   # terminal on the organiser's instance
  - ["This is the organisers' Intel Cloud instance with two Arc Pro B70 cards.",
     "This is the organisers' Intel Cloud instance, with two Arc Pro B seventy cards."]
  - ["Card zero runs the reasoning model, card one the vision model. Both stay loaded."]

review:
  - ["A scanned discharge summary. One click, and both cards work on it."]

review_found:
  - ["Ten seconds later: names, ID numbers, dates, the signature and the seal are found.",
     "Ten seconds later: names, I D numbers, dates, the signature and the seal are found."]

ferry:
  - ["And here is the combination clue: the ferry captain on Green Island."]

policies:
  - ["Each use gets its own policy. Research gets consistent pseudonyms,"]
  - ["a court filing keeps the parties, and a public release keeps only the doctor acting officially."]

export:
  - ["The agent attacked the redacted page: nothing identifying is left."]
  - ["A person approves. Export burns the redaction into the pixels and writes an audit log."]

chinese:
  - ["Traditional Chinese works the same way, with red seals and ROC dates.",
     "Traditional Chinese works the same way, with red seals and R O C dates."]

batch:
  - ["For a backlog, batch mode keeps both cards busy. This part is sped up."]

verify:   # terminal: live evaluation on v3
  - ["Is it accurate? We test on the same machine,"]
  - ["on documents made before any result was seen and never used for tuning."]

verify_result:
  - ["{live_recall} of all personal data found.",
     "{live_recall_spoken} of all personal data found."]

proof:
  - ["On the hospital documents in that test, RedactAgent removes {hosp_recall} before anyone reviews it.",
     "On the hospital documents in that test, Redact Agent removes {hosp_recall_spoken} before anyone reviews it."]
  - ["A single human reviewer finds 81 percent.",
     "A single human reviewer finds eighty-one percent."]
  - ["And it catches {qi_recall} of the combination clues, which rules miss completely.",
     "And it catches {qi_recall_spoken} of the combination clues, which rules miss completely."]

robust:
  - ["Real scans are worse than our test pages, so we blurred, faxed, compressed and skewed them."]
  - ["Recall stays above {robust_min}. Rules alone find only 55 to 60 percent.",
     "Recall stays above {robust_min_spoken}. Rules alone find only fifty-five to sixty percent."]
  - ["Blur and low resolution cost the most, and pages the OCR could not fully read are flagged for review.",
     "Blur and low resolution cost the most, and pages the O C R could not fully read are flagged for review."]

hardware:
  - ["How does this run on the B70? The organisers proposed a dual-card agent host. We built it and measured it.",
     "How does this run on the B seventy? The organisers proposed a dual-card agent host. We built it and measured it."]
  - ["Card zero is the reasoning brain: a twenty-one billion parameter model in thirteen gigabytes, with room for thirty-seven parallel requests."]
  - ["Card one is the eyes: the vision model stays loaded and works on the same page at the same time."]

model:
  - ["Which reasoning model? We tested four open models on card zero with the same code."]
  - ["On unseen pages, gpt-oss-20b was best on recall and on precision at the same time, so it is the default.",
     "On unseen pages, G P T O S S twenty B was best on recall and on precision at the same time, so it is the default."]

ocr:
  - ["Speed came from measuring. GPU power fell as the load went up: the cards were waiting."]
  - ["The cause was on the CPU: OCR threads on three hundred forty-four cores were fighting each other.",
     "The cause was on the C P U: O C R threads on three hundred forty-four cores were fighting each other."]
  - ["Eight threads per OCR engine made OCR nine times faster.",
     "Eight threads per O C R engine made O C R nine times faster."]

loops:
  - ["One failure only shows up at scale: the reasoning model sometimes repeats itself."]
  - ["We measured first: in 380 calls, 30 looped, and only 7 never stopped.",
     "We measured first: in three hundred eighty calls, thirty looped, and only seven never stopped."]
  - ["So RedactAgent cancels a loop still running after two thousand tokens and retries; normal answers never get that far.",
     "So Redact Agent cancels a loop still running after two thousand tokens and retries; normal answers never get that far."]
  - ["For archives, a throughput mode samples the same model: no loops at all, and {fast_gain} more pages per minute.",
     "For archives, a throughput mode samples the same model: no loops at all, and {fast_gain_spoken} more pages per minute."]

cost:
  - ["One host handles about {pages_hour} pages an hour: three million a year on a single shift.",
     "One host handles about {pages_hour_spoken} pages an hour: three million a year on a single shift."]
  - ["A thousand pages take {min_per_1000} minutes and {kwh_per_1000} kilowatt-hours, with no per-page fee.",
     "A thousand pages take {min_per_1000} minutes and {kwh_per_1000} kilowatt hours, with no per-page fee."]
  - ["A cloud service would charge about thirty dollars, without Chinese, and the records would leave the hospital."]

ready:
  - ["It is ready for a hospital: nothing leaves the building,"]
  - ["it plugs into hospital systems, and nothing is released without a person's approval."]
  - ["And it deploys with one command on a B70 host.", "And it deploys with one command on a B seventy host."]

expand:
  - ["Hospitals are the first market, not the last."]
  - ["The engine already has court-filing and public-release policies,"]
  - ["and on the unseen bank statements and court judgments it found {other_recall} of the personal data, with {other_precision} precision.",
     "and on the unseen bank statements and court judgments it found {other_recall_spoken} of the personal data, with {other_precision_spoken} precision."]
  - ["Courts, insurers and agencies come next, each starting with a pilot on its own documents."]

next:
  - ["The three goals we set in Stage I are met on the B70.", "The three goals we set in Stage I are met on the B seventy."]
  - ["Next, we prove the rest: a study with reviewers, and a pilot with a hospital records office."]

outro:
  - ["RedactAgent. Share the document, not the person.", "Redact Agent. Share the document, not the person."]
