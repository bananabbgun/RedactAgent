<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedactAgent Batch</title>
<link rel="stylesheet" href="static/style.css">
<style>
  .bwrap { padding: 14px; display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
  .kpis4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpis4 div { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .kpis4 b { display: block; font-size: 30px; color: var(--brand); }
  .kpis4 span { font-size: 12px; color: var(--muted); }
  table.jobs { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  table.jobs th { background: #0b1d4d; color: #fff; text-align: left; padding: 7px 10px; font-weight: 600; }
  table.jobs td { padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.jobs tr.clickable { cursor: pointer; }
  table.jobs tr.clickable:hover td { background: #f5f7ff; }
  .st { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .st.queued { background: #e2e8f0; color: #475569; } .st.running { background: #dbeafe; color: #1e40af; }
  .st.done { background: #dcfce7; color: #166534; } .st.error { background: #fee2e2; color: #991b1b; }
  .rk { font-weight: 700; } .rk.low { color: #166534; } .rk.mid { color: #b45309; } .rk.high { color: #b91c1c; }
  .tbl { max-height: calc(100vh - 330px); overflow: auto; border-radius: 10px; }
  body.hw .tbl { max-height: calc(100vh - 400px); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="7" y="11" width="11" height="4" fill="currentColor"/><rect x="7" y="18" width="18" height="4" fill="currentColor"/></svg>
    <div><div class="name">RedactAgent &middot; Batch</div><div class="tag">Many documents in flight &middot; every page reviewed on-prem</div></div>
  </div>
  <div class="models"><a class="chip" href="./" style="color:#fff;text-decoration:none">&#8592; single-document review</a></div>
</header>
<div class="hwbar hidden" id="hwbar"></div>
<div class="bwrap">
  <aside class="panel">
    <h3>Documents</h3>
    <select id="demo"><option value="12">12 pages from the test corpus</option><option value="36" selected>36 pages from the test corpus</option><option value="0">only uploaded files</option></select>
    <label class="drop" id="drop"><input type="file" id="files" multiple accept=".pdf,.png,.jpg,.jpeg" hidden><span id="dropText">or drop PDFs / scans here</span></label>
    <h3 style="margin-top:14px">Policy</h3>
    <select id="policy"></select>
    <button id="go" class="primary" style="margin-top:14px">Process batch</button>
    <p class="small muted" id="workers" style="margin-top:10px"></p>
    <div id="dl" class="downloads hidden"></div>
  </aside>
  <section>
    <div class="kpis4">
      <div><b id="kDone">0/0</b><span>documents done</span></div>
      <div><b id="kPpm">&ndash;</b><span>pages / minute</span></div>
      <div><b id="kTime">0s</b><span>elapsed</span></div>
      <div><b id="kRed">0</b><span>items redacted</span></div>
    </div>
    <div class="tbl"><table class="jobs"><thead><tr><th>Document</th><th>Status</th><th>Findings</th><th>Redacted</th><th>Re-ID risk</th><th>Unread</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</div>
<script src="static/app.js" data-mode="batch"></script>
<script>
const B = { files: [], bid: null };
const q = (s) => document.querySelector(s);
(async () => {
  const info = await (await fetch("api/info")).json();
  q("#policy").innerHTML = info.policies.map((p) => `<option value="${p.id}" ${p.id === "strict" ? "selected" : ""}>${p.name}</option>`).join("");
})();
const d = q("#drop");
d.onclick = () => q("#files").click();
q("#files").onchange = (e) => pick([...e.target.files]);
d.ondragover = (e) => { e.preventDefault(); d.classList.add("over"); };
d.ondragleave = () => d.classList.remove("over");
d.ondrop = (e) => { e.preventDefault(); d.classList.remove("over"); pick([...e.dataTransfer.files]); };
function pick(fs) { B.files = fs; q("#dropText").textContent = `✓ ${fs.length} file(s)`; }
q("#go").onclick = async () => {
  const fd = new FormData();
  B.files.forEach((f) => fd.append("files", f));
  fd.append("demo", q("#demo").value);
  fd.append("policy", q("#policy").value);
  q("#go").disabled = true;
  q("#dl").classList.add("hidden");
  const r = await fetch("api/batches", { method: "POST", body: fd });
  if (!r.ok) { alert(await r.text()); q("#go").disabled = false; return; }
  B.bid = (await r.json()).id;
  poll();
};
const riskCls = (s) => (s == null ? "" : s >= 50 ? "high" : s >= 20 ? "mid" : "low");
async function poll() {
  const s = await (await fetch(`api/batches/${B.bid}`)).json();
  q("#workers").textContent = `${s.workers} documents processed in parallel`;
  q("#kDone").textContent = `${s.done}/${s.total}`;
  q("#kPpm").textContent = s.pages_per_min || "–";
  q("#kTime").textContent = Math.round(s.elapsed) + "s";
  q("#kRed").textContent = s.rows.reduce((a, r) => a + r.redacted, 0);
  q("#rows").innerHTML = s.rows.map((r) => `<tr class="${r.status === "done" ? "clickable" : ""}" data-id="${r.id}">
    <td>${r.filename}</td><td><span class="st ${r.status}">${r.status}</span></td><td>${r.status === "done" ? r.findings : ""}</td>
    <td>${r.status === "done" ? r.redacted : ""}</td><td class="rk ${riskCls(r.risk)}">${r.risk ?? ""}</td>
    <td>${r.status === "done" ? (r.warnings ? "⚠ " + r.warnings : "✓") : ""}</td><td>${r.seconds ? r.seconds + "s" : ""}</td></tr>`).join("");
  document.querySelectorAll("tr.clickable").forEach((tr) => (tr.onclick = () => window.open(`./?job=${tr.dataset.id}`, "_blank")));
  if (!s.all_done) { setTimeout(poll, 700); return; }
  q("#go").disabled = false;
  q("#dl").innerHTML = `<a href="api/batches/${B.bid}/export.zip">&#11015; all redacted PDFs + reports (ZIP)</a>`;
  q("#dl").classList.remove("hidden");
}
</script>
</body>
</html>
